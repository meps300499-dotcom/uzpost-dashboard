*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#EEF2FF,#F5F7FA,#FFF4ED);color:#1A1A2E;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:18px 12px}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:20px;font-weight:900;letter-spacing:-.5px;color:#003087}
.sub{font-size:11px;color:#6B7280;margin-top:2px}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;background:linear-gradient(135deg,#003087,#0050B3);padding:14px 18px;border-radius:14px;box-shadow:0 4px 16px rgba(0,48,135,.25)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s}
.tab.on{background:#003087;color:#fff;box-shadow:0 2px 8px rgba(0,48,135,.3)}
.tab.off{background:#fff;color:#6B7280;border:1px solid #D1D5DB}
.tab.off:hover{background:#F0F4FF;color:#003087;border-color:#003087}
.tab-fact.on{background:#FF6B00!important;box-shadow:0 2px 8px rgba(255,107,0,.3)!important}
.years{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.yr{padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;border:1px solid #D1D5DB;background:#fff;color:#6B7280;transition:all .15s}
.yr.on{background:#FF6B00;color:#fff;border-color:#FF6B00;box-shadow:0 2px 6px rgba(255,107,0,.35)}
.yr:hover:not(.on){background:#FFF4ED;border-color:#FF6B00;color:#FF6B00}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{border-radius:12px;padding:11px 14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.kpi-label{font-size:9px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.kpi-val{font-size:16px;font-weight:900;line-height:1.2}
.kpi-sub{font-size:10px;color:#9CA3AF;margin-top:2px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-title{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:10px}
.proj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.proj-item{border-radius:10px;padding:10px 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s,box-shadow .15s}
.proj-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.proj-name{font-size:13px;font-weight:800;margin-bottom:3px}
.proj-rev{font-size:13px;font-weight:900}
.proj-vol{font-size:10px;color:#9CA3AF;margin-top:2px}
.all-proj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.all-proj-item{border-radius:10px;padding:10px 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s,box-shadow .15s}
.all-proj-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.all-proj-name{font-size:13px;font-weight:800;margin-bottom:3px}
.all-proj-desc{font-size:10px;color:#6B7280;line-height:1.4}
.partner-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.partner-item{border-radius:10px;padding:10px 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.partner-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.partner-name{font-size:13px;font-weight:800;color:#1A1A2E}
.partner-badge{border-radius:5px;padding:1px 6px;font-size:8px;font-weight:700;white-space:nowrap;margin-left:4px}
.partner-svc{font-size:10px;color:#9CA3AF}
.tariff-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tariff-group{border-radius:14px;padding:14px;border:1px solid #E5E7EB;margin-bottom:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tariff-group-title{font-size:11px;font-weight:800;margin-bottom:8px}
.tariff-input-wrap{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:9px 12px;margin-bottom:6px;transition:all .15s}
.tariff-input-wrap:focus-within{background:#FFF4ED;border-color:#FF6B00}
.tariff-label{font-size:11px;color:#6B7280;font-weight:600}
.tariff-note{font-size:9px;color:#9CA3AF;font-style:italic;margin-bottom:3px}
.tariff-input-row{display:flex;align-items:center;gap:6px}
.tariff-input{flex:1;background:transparent;border:none;outline:none;color:#1A1A2E;font-size:17px;font-weight:900;font-family:inherit;width:100%}
.tariff-cur{font-size:11px;color:#9CA3AF;font-weight:600;white-space:nowrap}
.footer{margin-top:12px;padding:8px 14px;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:10px;font-size:10px;color:#6B7280}
canvas{max-height:220px}
section{display:none}
section.active{display:block}

/* Fact */
.fact-status{padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fact-status.loading{background:#EEF2FF;border:1px solid #C7D2FE;color:#3B82F6}
.fact-status.ok{background:#F0FDF4;border:1px solid #86EFAC;color:#16a34a}
.fact-status.err{background:#FEF2F2;border:1px solid #FCA5A5;color:#dc2626}
.fact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.fact-partner{border-radius:10px;padding:12px 14px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.fact-partner-name{font-size:13px;font-weight:800;color:#1A1A2E;margin-bottom:8px}
.fact-bar-wrap{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.fact-bar-label{font-size:9px;color:#9CA3AF;width:28px;text-align:right;flex-shrink:0}
.fact-bar-track{flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden}
.fact-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.fact-bar-val{font-size:10px;font-weight:700;width:56px;flex-shrink:0;text-align:right}
.fact-delta{font-size:11px;font-weight:900;margin-top:6px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(16px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.modal-title{font-size:17px;font-weight:900}
.modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:#9CA3AF;flex-shrink:0;line-height:1;padding:0}
.modal-desc{font-size:14px;color:#374151;line-height:1.6;margin-bottom:16px;background:#F9FAFB;border-radius:10px;padding:14px}
.modal-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-kpi-item{border-radius:8px;padding:10px 12px}
.modal-kpi-label{font-size:9px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.modal-kpi-val{font-size:15px;font-weight:900}

/* Export */
.export-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn-export{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:5px}
.btn-export:hover{transform:translateY(-1px);opacity:.9}
.btn-pdf{background:#EF4444;color:#fff;box-shadow:0 2px 6px rgba(239,68,68,.3)}
.btn-xlsx{background:#16a34a;color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.3)}
.btn-refresh{background:#F0F4FF;color:#0050B3;border:1px solid #C7D2FE}
.sync-info{font-size:10px;color:#9CA3AF;margin-left:auto}

@media print{
  .export-bar,.header .tabs,.years,.footer,.modal-overlay{display:none!important}
  body{background:#fff;padding:8px}
  canvas{max-height:180px}
}
</style>

function calcProj(m){
  const g=(b,r)=>b*Math.pow(1+r/100,m);
  const pvz=g(T.pvzStart,T.pvzGrowth)*T.pvzTariff;
  const b2bfull=g(T.b2bfullStart,T.b2bfullGrowth)*T.b2bfullTariff;
  const courier=g(T.courierStart,T.courierGrowth)*T.courierTariff;
  const dropship=g(T.dropshipStart,T.dropshipGrowth)*T.dropshipAvgKg*T.dropshipKg;
  const remail=g(T.remailStart,T.remailGrowth)*T.remailUSD*UZS;
  const transit=g(T.transitStart,T.transitGrowth)*T.transitUSD*UZS;
  const rent=g(T.rentStart,T.rentGrowth)*T.rentMonthly;
  return{pvz,b2bfull,courier,dropship,remail,transit,rent,
    pvzVol:Math.round(g(T.pvzStart,T.pvzGrowth)),
    courierVol:Math.round(g(T.courierStart,T.courierGrowth)),
    dropshipVol:Math.round(g(T.dropshipStart,T.dropshipGrowth)),
    remailVol:Math.round(g(T.remailStart,T.remailGrowth)),
    transitVol:Math.round(g(T.transitStart,T.transitGrowth)),
    rentVol:Math.round(g(T.rentStart,T.rentGrowth)),
    total:pvz+b2bfull+courier+dropship+remail+transit+rent};
}

function calcPart(m){
  const base={uzum:129036,ozon:11353,birqadam:86983,makeup:3789,yandex:17500,avito:2000,letters:327070,hybrid:3524336,exzap:10};
  const g=(b,r=10)=>b*Math.pow(1+r/100,m);
  const uzum=g(base.uzum)*T.tUzum,ozon=g(base.ozon)*T.tOzon,birqadam=g(base.birqadam)*T.tBirQadam;
  const makeup=g(base.makeup,3)*T.tMakeUp,yandex=g(base.yandex)*T.tYandex,avito=g(base.avito,15)*T.tAvito;
  const letters=g(base.letters,3)*T.tLetters,hybrid=g(base.hybrid,5)*T.tHybrid,exzap=g(base.exzap,10)*T.tExzap;
  return{uzum,ozon,birqadam,makeup,yandex,avito,letters,hybrid,exzap,
    uzumVol:Math.round(g(base.uzum)),birqadamVol:Math.round(g(base.birqadam)),
    total:uzum+ozon+birqadam+makeup+yandex+avito+letters+hybrid+exzap};
}

async function getToken(){
  const hdr=btoa(JSON.stringify({alg:"RS256",typ:"JWT"})).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const now=Math.floor(Date.now()/1000);
  const clm=btoa(JSON.stringify({iss:SVC_EMAIL,scope:"https://www.googleapis.com/auth/spreadsheets.readonly",aud:"https://oauth2.googleapis.com/token",exp:now+3600,iat:now})).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const unsigned=hdr+"."+clm;
  const pem=PRIV_KEY.replace("-----BEGIN PRIVATE KEY-----","").replace("-----END PRIVATE KEY-----","").replace(/\n/g,"").trim();
  const der=Uint8Array.from(atob(pem),c=>c.charCodeAt(0));
  const ck=await crypto.subtle.importKey("pkcs8",der.buffer,{name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"},false,["sign"]);
  const sig=await crypto.subtle.sign("RSASSA-PKCS1-v1_5",ck,new TextEncoder().encode(unsigned));
  const sb=btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const jwt=unsigned+"."+sb;
  const r=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`});
  const d=await r.json();
  if(!d.access_token)throw new Error(JSON.stringify(d));
  return d.access_token;
}

async function fetchRange(token,range){
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`,{headers:{Authorization:"Bearer "+token}});
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.values||[];
}

function parseNum(v){if(!v)return 0;const n=parseFloat((v+"").replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n;}

async function loadFactData(){
  document.getElementById("sync-info").textContent="⏳ Загружаем...";
  try{
    const token=await getToken();
    // Fetch rows 1-30 of "Факт продаж" sheet
    const rows=await fetchRange(token,"Факт продаж!A1:O30");
    factData={};
    let inSecondTable=false;
    for(let i=1;i<rows.length;i++){
      const row=rows[i];
      if(!row||!row[1])continue;
      const name=(row[1]||"").trim();
      if(!name||name==="Наименование")continue;
      // Skip empty rows / separators
      const months=[];
      for(let m=2;m<=13;m++) months.push(parseNum(row[m]));
      const total=row[14]?parseNum(row[14]):months.reduce((a,b)=>a+b,0);
      factData[name]={months,total};
    }
    factLoaded=true;factErr=null;
    document.getElementById("sync-info").textContent="✅ Факт обновлён: "+new Date().toLocaleTimeString("ru-RU");
    if(activeTab==="fact")renderFact();
  }catch(e){
    factErr=e.message;factLoaded=false;
    document.getElementById("sync-info").textContent="⚠️ Ошибка загрузки";
    console.error(e);
    if(activeTab==="fact")renderFact();
  }
}

function daysLeft(deadline){
  if(!deadline) return null;
  const diff=Math.ceil((new Date(deadline)-new Date())/(1000*60*60*24));
  return diff;
}
function deadlineBadge(deadline){
  if(!deadline) return "";
  const d=daysLeft(deadline);
  const color=d<0?"#dc2626":d<30?"#FF6B00":d<90?"#f59e0b":"#16a34a";
  const label=d<0?`Просрочен ${Math.abs(d)}д`:d===0?"Сегодня!":d+"д";
  return `<span style="font-size:9px;font-weight:700;color:${color};background:${color}15;border:1px solid ${color}30;border-radius:4px;padding:1px 5px">📅 ${label}</span>`;
}
function partnerRevenue(p){
  const tariff=T[p.tariffKey]||0;
  if(!tariff) return {rev:0,vol:0};
  const key=p.name.toLowerCase().replace(/[^a-zа-яё]/gi,"");
  const partKey=Object.keys({uzum:1,ozon:1,birqadam:1,makeup:1,yandex:1,avito:1,letters:1,hybrid:1,exzap:1}).find(k=>p.name.toLowerCase().includes(k.replace("letters","письм").replace("hybrid","гибрид")))||"";
  const last=partRows[partRows.length-1];
  const vol=last[partKey+"Vol"]||last[partKey]||0;
  return {rev:vol*tariff,vol};
}

      </div>
      <div style="padding:20px;text-align:center;color:#9CA3AF;font-size:13px">
        Убедитесь что таблица открыта для:<br><b style="color:#374151">uzpost-sheets@universal-ion-489917-u2.iam.gserviceaccount.com</b>

  const planFebTotal=planFeb.uzum+planFeb.ozon+planFeb.birqadam+planFeb.makeup+planFeb.yandex+planFeb.avito+planFeb.letters+planFeb.hybrid+planFeb.exzap;
  const planTotal2m=planJanTotal+planFebTotal;
  const factTotal2m=(monthTotals[0]||0)+(monthTotals[1]||0);

        <div class="kpi-label">E-Commerce факт (без писем)</div>
        <div class="kpi-val" style="color:#FF6B00">${fmtN(
          (factData["Uzum"]?.total||0)+(factData["Ozon"]?.total||0)+
          (factData["BirQadam"]?.total||0)+(factData["MakeUp"]?.total||0)+
          (factData["Exzap"]?.total||0)+(factData["Avito"]?.total||0)
        )} шт</div>
        <div class="kpi-sub">маркетплейсы янв+фев</div>
      </div>
      <div class="kpi" style="background:#c084fc10;border:1px solid #c084fc25">
        <div class="kpi-label">Письма + Гибридка факт</div>
        <div class="kpi-val" style="color:#7c3aed">${fmtN((factData["Письма"]?.total||0)+(factData["Гибридка"]?.total||0))} шт</div>

  // Monthly bar chart
  const nzLabels=mnNames.filter((_,i)=>monthTotals[i]>0);

  const topPartners=partners.filter(([,d])=>(d.months[0]||0)+(d.months[1]||0)>0).sort(([,a],[,b])=>(b.months[0]+b.months[1])-(a.months[0]+a.months[1])).slice(0,10);
  if(topPartners.length){

  }
}

function updateT(el){
  T[el.dataset.key]=parseFloat(el.value)||0;
  M36.forEach(m=>{Object.assign(projRows[m],calcProj(m));Object.assign(partRows[m],calcPart(m));});
  render();
}

function exportXLSX(){
  const wb=XLSX.utils.book_new();
  const ph=["Месяц","Рыночный десант","Доставка до МП","Курьерская","Дропшип","Ремейлинг","Транзит","Аренда","ИТОГО"];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([ph,...M36.map((m,i)=>{const r=projRows[m];return[ML[i],Math.round(r.pvz),Math.round(r.b2bfull),Math.round(r.courier),Math.round(r.dropship),Math.round(r.remail),Math.round(r.transit),Math.round(r.rent),Math.round(r.total)];})]),`Проекты (прогноз)`);
  const pth=["Месяц","Uzum","Ozon","BirQadam","MakeUp","Yandex","Avito","Письма","Гибридка","ИТОГО"];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([pth,...M36.map((m,i)=>{const r=partRows[m];return[ML[i],Math.round(r.uzum),Math.round(r.ozon),Math.round(r.birqadam),Math.round(r.makeup),Math.round(r.yandex),Math.round(r.avito),Math.round(r.letters),Math.round(r.hybrid),Math.round(r.total)];})]),`Партнёры (прогноз)`);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Год","Проекты (сум)","Партнёры (сум)","Всего (сум)","Всего ($)"],...[0,1,2].map(yr=>{const ps=projRows.slice(yr*12,(yr+1)*12).reduce((a,r)=>a+r.total,0);const pt=partRows.slice(yr*12,(yr+1)*12).reduce((a,r)=>a+r.total,0);return[2025+yr,Math.round(ps),Math.round(pt),Math.round(ps+pt),Math.round((ps+pt)/UZS)];})]),"Итоги по годам");
  if(factLoaded&&factData)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Партнёр","Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек","ИТОГО"],...Object.entries(factData).map(([n,d])=>[n,...d.months,d.total])]),"Факт 2026");
  XLSX.writeFile(wb,`UzPost_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ===== MAIN =====
function render(){
  if(activeTab==="projects")renderProjects();
  else if(activeTab==="partners")renderPartners();
  else if(activeTab==="fact")renderFact();
  else renderTariffs();
}

document.getElementById("tabs").addEventListener("click",e=>{
  const btn=e.target.closest("[data-tab]");if(!btn)return;
  activeTab=btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(b=>{b.className="tab off"+(b.dataset.tab==="fact"?" tab-fact":"");});
  btn.className="tab on"+(activeTab==="fact"?" tab-fact":"");
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById("sec-"+activeTab).classList.add("active");
  render();
});

document.getElementById("years").addEventListener("click",e=>{
  const btn=e.target.closest("[data-yr]");if(!btn)return;
  activeYr=btn.dataset.yr;
  document.querySelectorAll(".yr").forEach(b=>b.className="yr off");
  btn.className="yr on";
  render();
});

render();
loadFactData();
